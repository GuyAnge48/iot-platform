<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IoT Platform{% endblock %}</title>

    <!-- Tailwind CSS via CDN — pas de build step nécessaire pour la V1 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#6366f1', hover: '#4f46e5' },
                        surface: { DEFAULT: '#111827', card: '#1f2937', border: '#374151' },
                    }
                }
            }
        }
    </script>

    <!-- HTMX — interactions serveur sans JavaScript custom -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Lucide Icons — icônes SVG légères -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Chart.js — graphiques télémétrie -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        /* Indicateur de statut IoT — point coloré avec glow pour online/warning */
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .status-dot.online    { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
        .status-dot.offline   { background: #6b7280; }
        .status-dot.warning   { background: #f59e0b; box-shadow: 0 0 6px #f59e0b88; }
        .status-dot.error     { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
        .status-dot.connecting{ background: #3b82f6; animation: pulse 1.5s infinite; }

        /* Lien actif dans la sidebar */
        .sidebar-item.active {
            background: rgba(99,102,241,0.15);
            color: #a5b4fc;
            border-left: 2px solid #6366f1;
        }

        /* Animation de valeur mise à jour en temps réel */
        @keyframes flash-update {
            0%   { background-color: rgba(99,102,241,0.3); }
            100% { background-color: transparent; }
        }
        .value-updated { animation: flash-update 0.8s ease-out; }
    </style>
</head>
<body class="h-full text-gray-100 antialiased">

<div class="flex h-screen overflow-hidden">

    <!-- Sidebar de navigation principale -->
    {% include "base/sidebar.html" %}

    <!-- Zone principale : navbar + contenu de page -->
    <div class="flex flex-col flex-1 min-w-0 overflow-hidden">

        <!-- Barre de navigation supérieure -->
        {% include "base/navbar.html" %}

        <!-- Contenu de la page courante -->
        <main class="flex-1 overflow-y-auto bg-gray-950 p-6">
            {% block content %}{% endblock %}
        </main>

    </div>
</div>

<!-- Conteneur des toasts (notifications temporaires) -->
<div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

<script>
    // Initialise les icônes Lucide au chargement et après chaque swap HTMX
    lucide.createIcons();
    document.addEventListener('htmx:afterSwap', () => lucide.createIcons());

    // Fonction toast globale — appelable depuis n'importe quel script de page
    function showToast(message, type = 'success') {
        const colors = {
            success: 'bg-green-900 border-green-700 text-green-200',
            error:   'bg-red-900 border-red-700 text-red-200',
            info:    'bg-blue-900 border-blue-700 text-blue-200',
            warning: 'bg-yellow-900 border-yellow-700 text-yellow-200',
        };
        const toast = document.createElement('div');
        toast.className = `border rounded-lg px-4 py-3 text-sm shadow-lg pointer-events-auto ${colors[type] || colors.info}`;
        toast.textContent = message;
        document.getElementById('toast-container').appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }
</script>
<!-- WebSocket client global — chargé sur toutes les pages authentifiées -->
<script src="/static/js/ws.js"></script>

{% block scripts %}{% endblock %}
</body>
</html>
