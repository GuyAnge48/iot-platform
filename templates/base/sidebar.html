<!-- Sidebar desktop — visible md+ uniquement -->
<aside class="hidden md:flex flex-col w-60 bg-gray-900 border-r border-gray-800 shrink-0 h-full">

    <!-- Logo de la plateforme -->
    <div class="flex items-center gap-3 px-5 py-5 border-b border-gray-800">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shrink-0">
            <i data-lucide="cpu" class="w-4 h-4 text-white"></i>
        </div>
        <span class="font-semibold text-white text-sm tracking-wide">IoT Platform</span>
    </div>

    <!-- Navigation principale -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">

        <p class="text-xs text-gray-500 uppercase tracking-wider px-2 mb-2">Principal</p>

        <!-- Lien actif = classe "active" appliquée via active_page -->
        <a href="/dashboard"
           class="sidebar-item {% if active_page == 'dashboard' %}active{% endif %} flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
            <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i>
            Dashboard
        </a>

        <a href="/devices"
           class="sidebar-item {% if active_page == 'devices' %}active{% endif %} flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
            <i data-lucide="cpu" class="w-4 h-4 shrink-0"></i>
            Appareils
        </a>

        <a href="/alerts"
           class="sidebar-item {% if active_page == 'alerts' %}active{% endif %} flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
            <i data-lucide="bell" class="w-4 h-4 shrink-0"></i>
            Alertes
        </a>

        <!-- Section Analyse — pages activées -->
        <p class="text-xs text-gray-500 uppercase tracking-wider px-2 mt-4 mb-2">Analyse</p>

        <!-- Télémétrie — page active -->
        <a href="/telemetry"
           class="sidebar-item {% if active_page == 'telemetry' %}active{% endif %} flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
            <i data-lucide="line-chart" class="w-4 h-4 shrink-0"></i>
            Télémétrie
        </a>

        <!-- Automatisations — page à développer -->
        <a href="/automations"
           class="sidebar-item {% if active_page == 'automations' %}active{% endif %} flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
            <i data-lucide="zap" class="w-4 h-4 shrink-0"></i>
            Automatisations
        </a>

        <!-- Section Administration -->
        <p class="text-xs text-gray-500 uppercase tracking-wider px-2 mt-4 mb-2">Administration</p>

        <!-- Équipes — page à développer -->
        <a href="/teams"
           class="sidebar-item {% if active_page == 'teams' %}active{% endif %} flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
            <i data-lucide="users" class="w-4 h-4 shrink-0"></i>
            Équipes
        </a>

        <!-- Paramètres — page à développer -->
        <a href="/settings"
           class="sidebar-item {% if active_page == 'settings' %}active{% endif %} flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
            <i data-lucide="settings" class="w-4 h-4 shrink-0"></i>
            Paramètres
        </a>
    </nav>

    <!-- Profil utilisateur en bas de sidebar -->
    <div class="px-4 py-4 border-t border-gray-800">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-indigo-700 flex items-center justify-center text-xs font-bold text-white shrink-0">
                GA
            </div>
            <div class="min-w-0">
                <p class="text-sm text-white font-medium truncate">Guy Ange</p>
                <p class="text-xs text-gray-500 truncate">Administrateur</p>
            </div>
            <a href="/logout" class="ml-auto text-gray-600 hover:text-gray-400 shrink-0" title="Déconnexion">
                <i data-lucide="log-out" class="w-4 h-4"></i>
            </a>
        </div>
    </div>
</aside>
