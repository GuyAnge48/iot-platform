<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — IoT Platform</title>
    <!-- Tailwind CDN — page standalone sans base.html car pas de sidebar sur login -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="h-full flex items-center justify-center text-gray-100">

<div class="w-full max-w-sm px-6">

    <!-- Logo centré -->
    <div class="flex flex-col items-center mb-8">
        <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center mb-4">
            <i data-lucide="cpu" class="w-6 h-6 text-white"></i>
        </div>
        <h1 class="text-xl font-bold text-white">IoT Platform</h1>
        <p class="text-sm text-gray-500 mt-1">Supervision & Contrôle</p>
    </div>

    <!-- Carte de connexion -->
    <div class="bg-gray-900 rounded-xl border border-gray-800 p-6 shadow-xl">
        <h2 class="text-base font-semibold text-white mb-5">Connexion</h2>

        <!-- Message d'erreur (affiché uniquement si error est défini) -->
        {% if error %}
        <div class="bg-red-900/50 border border-red-700 text-red-300 text-sm rounded-lg p-3 mb-4 flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
            {{ error }}
        </div>
        {% endif %}

        <!-- Formulaire POST classique — HTMX non nécessaire ici -->
        <form method="post" action="/login" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1.5">Identifiant</label>
                <input type="text" name="username" placeholder="admin"
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                       required autofocus>
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1.5">Mot de passe</label>
                <input type="password" name="password" placeholder="••••••••"
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                       required>
            </div>
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition-colors mt-2">
                Se connecter
            </button>
        </form>
    </div>

    <!-- Hint démo -->
    <p class="text-center text-xs text-gray-600 mt-4">
        Démo — tout identifiant non vide fonctionne
    </p>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
