<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-950">
<head>
    <meta charset="UTF-8">
    <title>Page introuvable — IoT Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="h-full flex items-center justify-center text-gray-100">
<div class="text-center px-6">
    <div class="w-16 h-16 rounded-2xl bg-gray-900 border border-gray-800 flex items-center justify-center mx-auto mb-6">
        <i data-lucide="alert-triangle" class="w-8 h-8 text-yellow-400"></i>
    </div>
    <p class="text-5xl font-bold text-white mb-2">404</p>
    <p class="text-lg text-gray-400 mb-1">Page introuvable</p>
    <p class="text-sm text-gray-600 mb-8">Cette page n'existe pas ou a été déplacée.</p>
    <a href="/dashboard"
       class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        Retour au dashboard
    </a>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
